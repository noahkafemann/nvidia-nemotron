<!DOCTYPE html>
<html lang="de" data-api-key="__NVIDIA_API_KEY__">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nemotron Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="grid-bg"></div>
<app>
  <header>
    <h1>Nemotron Chat</h1>
    <p>NVIDIA Nemotron &middot; Futuristic Interface</p>
  </header>

  <messages id="messages"></messages>

  <input-area>
    <form id="chatForm">
      <input id="userInput" type="text" placeholder="Nachricht eingeben..." autocomplete="off" />
      <button type="submit" class="send" id="sendBtn">&#9654;</button>
    </form>
    <div class="status" id="status">Bereit</div>
    <div class="key-warning" id="key-warning">Kein API Key konfiguriert. Bitte den Secret 'NVIDIA_API_KEY' im Repository hinterlegen.</div>
  </input-area>
</app>

<script src="script.js"></script>
</body>
</html>
