<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nemotron Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="grid-bg"></div>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-card-inner">
        <div class="auth-header">
          <div class="logo-icon">N</div>
          <h1>Nemotron</h1>
          <p>Willkommen zurück. Bitte melde dich an, um deine KI-Erfahrung fortzusetzen.</p>
        </div>
        
        <div class="auth-form">
          <div class="input-group">
            <input type="email" id="authEmail" placeholder="E-Mail Adresse" autocomplete="off">
          </div>
          <div class="input-group">
            <input type="password" id="authPassword" placeholder="Passwort" autocomplete="off">
          </div>
          
          <div class="auth-actions">
            <button id="btnLogin" class="btn-main">Einloggen</button>
            <button id="btnRegister" class="btn-sub">Konto erstellen</button>
          </div>
          <div id="authError" class="auth-error"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
